<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>דלתות מגן — בונים דלת</title>
<meta name="robots" content="noindex">
<meta name="description" content="בחירת דלת כניסה — בפיתוח.">
<style>
  :root{
    --paper:#EFEDE8; --ink:#171715; --ink-2:#6B6862;
    --rule:#D6D3CB; --accent:#B08D57;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Segoe UI","Arial Hebrew",Arial,system-ui,sans-serif;
    line-height:1.6;
    display:grid; place-items:center; padding:24px;
  }
  main{max-width:36rem; width:100%}
  .tag{
    font-size:.72rem; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-2); margin:0 0 1.5rem;
    font-variant-numeric:tabular-nums;
  }
  h1{
    font-size:clamp(1.9rem,7vw,3rem); line-height:1.15;
    letter-spacing:-.02em; font-weight:600; margin:0 0 1rem;
  }
  p{margin:0 0 1rem; color:var(--ink-2); max-width:34ch}
  hr{border:0; border-top:1px solid var(--rule); margin:2rem 0}
  .meta{font-size:.85rem; color:var(--ink-2); font-variant-numeric:tabular-nums}
  a{color:var(--ink); text-decoration-color:var(--accent); text-underline-offset:.25em}
  a:hover{color:var(--accent)}
  .dot{
    display:inline-block; inline-size:.5rem; block-size:.5rem;
    border-radius:50%; background:var(--accent); margin-inline-end:.5rem;
    vertical-align:middle;
  }
</style>
</head>
<body>
<main>
  <p class="tag"><span class="dot"></span>בפיתוח</p>

  <h1>בונים כאן משהו.</h1>

  <p>
    כלי לבחירת דלת כניסה — צבע, חלון ומידה, עם מחיר מלא
    שכולל התקנה ומע״מ, ושליחה ישירה אלינו בוואטסאפ.
  </p>

  <hr>

  <p class="meta">
    בינתיים אפשר לראות דלתות שהתקנו באתר הראשי —<br>
    <a href="https://dlatotmagen.co.il/works">dlatotmagen.co.il</a>
    · <a href="tel:0532197466">053-219-7466</a>
  </p>
</main>
</body>
</html>
